name: Build and publish docker image
on:
  workflow_call:
permissions:
  contents: read
  packages: write
env:
  BASE_IMAGE: hamstring-zeek
  BASE_IMAGE_USER: ghcr.io/hamstring-ndr
  IMAGE_NAME: bicep-hamstring
  IMAGE_OWNER: ${{ github.repository_owner }}
  REGISTRY: ghcr.io

jobs:
  get_latest_version:
    runs-on: ubuntu-latest
    outputs:
        OFFICIAL_RELEASE_VERSION: ${{ steps.sets_OFFICIAL_RELEASE_VERSION.outputs.OFFICIAL_RELEASE_VERSION }}
    steps:
    - name: Retrieve latest official version published on GHCR
      shell: bash
      run: |
        BASE_IMAGE_USER_CLEAN="${BASE_IMAGE_USER#ghcr.io/}"
        token=$(curl -s "https://ghcr.io/token?scope=repository:${BASE_IMAGE_USER_CLEAN}/${BASE_IMAGE}:pull" | jq -r '.token')
        status_code_accessing_registry=$(curl -o response.json -w "%{http_code}"  -s -H "Authorization: Bearer $token" "https://ghcr.io/v2/${BASE_IMAGE_USER_CLEAN}/${BASE_IMAGE}/tags/list")

        if [ "$status_code_accessing_registry" -eq 404 ]; then
            echo "Package not found."
            OFFICIAL_RELEASE_VERSION=""
        elif [ "$status_code_accessing_registry" -eq 200 ]; then
            OFFICIAL_RELEASE_VERSION=$(jq -r '.tags[]? | select(. != "latest")' response.json | sort -V | tail -n1)
            if [ -z "$OFFICIAL_RELEASE_VERSION" ]; then
              OFFICIAL_RELEASE_VERSION=$(jq -r '.tags[]?' response.json | head -n1)
            fi
            if [ -z "$OFFICIAL_RELEASE_VERSION" ]; then
              echo "Found the registry repository, but could not find latest version in the tags"
            else
              echo "Found latest release with version number ${OFFICIAL_RELEASE_VERSION}"
            fi
        else
            echo "Unexpected HTTP status code: $status_code_accessing_registry"
            exit 1
        fi    
        echo "OFFICIAL_RELEASE_VERSION=$OFFICIAL_RELEASE_VERSION" >> $GITHUB_ENV

    - name: check latest version published by us on GHCR
      shell: bash
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        IMAGE_OWNER_CLEAN="${IMAGE_OWNER#ghcr.io/}"
        token=$(curl -s -u "${GHCR_USER}:${GHCR_TOKEN}" "https://ghcr.io/token?scope=repository:${IMAGE_OWNER_CLEAN}/${IMAGE_NAME}:pull" | jq -r '.token')
        status_code_accessing_registry=$(curl -o response.json -w "%{http_code}"  -s -H "Authorization: Bearer $token" "https://ghcr.io/v2/${IMAGE_OWNER_CLEAN}/${IMAGE_NAME}/tags/list")

        if [ "$status_code_accessing_registry" -eq 404 ]; then
            echo "Package not found."
            LATEST_PUSHED_RELEASE=""
        elif [ "$status_code_accessing_registry" -eq 200 ]; then
            LATEST_PUSHED_RELEASE=$(jq -r '.tags[]? | select(. != "latest")' response.json | sort -V | tail -n1)
            if [ -z "$LATEST_PUSHED_RELEASE" ]; then
              LATEST_PUSHED_RELEASE=$(jq -r '.tags[]?' response.json | head -n1)
            fi
            if [ -z "$LATEST_PUSHED_RELEASE" ]; then
              echo "Found the registry repository, but could not find latest version in the tags"
            else
              echo "Found latest release with version number ${LATEST_PUSHED_RELEASE}"
            fi
        else
            echo "Unexpected HTTP status code: $status_code_accessing_registry"
            exit 1
        fi
        echo "LATEST_PUSHED_RELEASE=$LATEST_PUSHED_RELEASE" >> $GITHUB_ENV

    - name: comparing official version and latest release by us
      id: sets_OFFICIAL_RELEASE_VERSION
      shell: bash
      run: |
        echo "Newest version: $OFFICIAL_RELEASE_VERSION"
        echo "Latest version built: $LATEST_PUSHED_RELEASE"
        if [ "$OFFICIAL_RELEASE_VERSION" == "$LATEST_PUSHED_RELEASE" ]; then
          echo "base ref: ${{ github.base_ref }}"
          # not a  manual merge 
          if [ ${{ github.base_ref }} != "main" ]; then 
            echo "Not a manual merge and version already built and pushed, aborting the pipeline."
            exit 1
          fi
        fi
        echo "OFFICIAL_RELEASE_VERSION=$OFFICIAL_RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build_and_push:
      runs-on: ubuntu-latest
      needs: get_latest_version
      steps:  
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: set variable name to human readbale 
        run: |
          echo "OFFICIAL_RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
        env:
          VERSION: ${{ needs.get_latest_version.outputs.OFFICIAL_RELEASE_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create tags string
        run: echo "TAGS=${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:latest,${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:$OFFICIAL_RELEASE_VERSION" >> $GITHUB_ENV
      - name: Set up Docker for multiplatform docker build
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
        
      - name: Set up QEMU for multi platform docker build
        uses: docker/setup-qemu-action@v3
        
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: ./bicep-hamstring
          file: ./bicep-hamstring/Dockerfile
          push: true
          tags: ${{ env.TAGS }}
          build-args: | 
            BASE_IMAGE=${{ env.BASE_IMAGE_USER }}/${{ env.BASE_IMAGE }}
            VERSION=${{ env.OFFICIAL_RELEASE_VERSION }}
